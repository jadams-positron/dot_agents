  default_prompt: "Use $pr-description to draft or refresh a plain, code-grounded pull request description that ends with a pr-hygiene and distill pass. Before any outward write, require exact-target evidence from an independent clean-context abstraction review, and preserve any Bugbot summary already appended at the end."
